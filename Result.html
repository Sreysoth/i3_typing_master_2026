<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Results | TypeMaster 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            padding: 40px 20px;
            color: #2d3436;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Stats Summary Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-bottom: 4px solid #3498db;
        }

        .stat-card h3 {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #95a5a6;
            margin-bottom: 10px;
        }

        .stat-card p {
            font-size: 1.8rem;
            font-weight: bold;
            color: #2c3e50;
        }

        /* Table Styles */
        .results-box {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        h2 {
            margin-bottom: 20px;
            font-size: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th {
            text-align: left;
            background-color: #f8f9fa;
            padding: 15px;
            color: #7f8c8d;
            font-weight: 600;
            border-bottom: 2px solid #eee;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #eee;
            font-size: 0.95rem;
        }

        tr:hover {
            background-color: #fcfcfc;
        }

        /* Status Colors */
        .high-score {
            color: #27ae60;
            font-weight: bold;
        }

        .btn-back {
            text-decoration: none;
            color: #3498db;
            font-size: 0.9rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <header style="margin-bottom: 30px;">
            <a href="index.html" class="btn-back">← Back to Menu</a>
            <h1 style="margin-top: 10px;">Performance Dashboard</h1>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Average WPM</h3>
                <p>58</p>
            </div>
            <div class="stat-card">
                <h3>Best Speed</h3>
                <p class="high-score">74</p>
            </div>
            <div class="stat-card">
                <h3>Avg. Accuracy</h3>
                <p>96%</p>
            </div>
            <div class="stat-card" style="border-color: #e67e22;">
                <h3>Tests Taken</h3>
                <p>12</p>
            </div>
        </div>

        <div class="results-box">
            <h2>Recent Test History</h2>
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Speed (WPM)</th>
                        <th>Accuracy</th>
                        <th>Time</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Mar 23, 2026</td>
                        <td class="high-score">74 WPM</td>
                        <td>98%</td>
                        <td>1:00</td>
                    </tr>
                    <tr>
                        <td>Mar 21, 2026</td>
                        <td>62 WPM</td>
                        <td>94%</td>
                        <td>0:30</td>
                    </tr>
                    <tr>
                        <td>Mar 20, 2026</td>
                        <td>55 WPM</td>
                        <td>91%</td>
                        <td>1:00</td>
                    </tr>
                    <tr>
                        <td>Mar 18, 2026</td>
                        <td>49 WPM</td>
                        <td>88%</td>
                        <td>2:00</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
