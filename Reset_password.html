<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | TypeMaster 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #2d3436;
        }

        .card {
            background: white;
            padding: 2.5rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .icon-box {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: #3498db;
        }

        h2 {
            margin-bottom: 10px;
            color: #2c3e50;
        }

        p {
            font-size: 0.9rem;
            color: #636e72;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        .form-group {
            text-align: left;
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #2d3436;
        }

        input[type="email"] {
            width: 95%;
            padding: 10px;
            border: 1px solid #dfe6e9;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="email"]:focus {
            border-color: #3498db;
        }

        .btn-reset {
            width: 40%;
            padding: 13px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-reset:hover {
            background-color: #2980b9;
        }

        .back-link {
            display: block;
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: #3498db;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon-box">🔒</div>
        <h2>Forgot Password?</h2>
        <p>No worries! Enter your email address below and we'll send you instructions to reset your password.</p>

        <form>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="e.g. name@example.com" required>
            </div>
            
            <button type="submit" class="btn-reset">Send Reset Link</button>
        </form>

        <a href="login.html" class="back-link">← Back to Login</a>
    </div>

</body>
</html>
